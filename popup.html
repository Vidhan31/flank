<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split It</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="brand">
      <img src="icons/icon48.png" alt="" class="brand-icon">
      <span class="brand-name">Split It</span>
    </div>

    <div class="site-row">
      <div class="site-info">
        <div class="site-icon" id="site-icon-wrapper">
          <span id="site-icon-fallback">🌐</span>
        </div>
        <span class="site-domain" id="site-domain">...</span>
      </div>

      <label class="switch" for="split-toggle" aria-label="Toggle Split It for this website">
        <input type="checkbox" id="split-toggle" role="switch">
        <span class="slider"></span>
      </label>
    </div>

    <div class="permission-notice" role="note" aria-label="Permission notice">
      <div class="permission-header">
        <svg class="permission-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 1.5l5 2.2v4.8c0 3.3-2.3 5.4-5 6.5-2.7-1.1-5-3.2-5-6.5V3.7l5-2.2z" />
        </svg>
        <span>Website access</span>
      </div>
      <p class="permission-text">
        Split It only has permission to access Reddit and X by default. You must approve access for other sites individually.
      </p>
    </div>
  </div>

  <script src="site-settings.js"></script>
  <script src="url-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
